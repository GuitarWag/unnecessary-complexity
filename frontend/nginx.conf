server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS for module-federation remoteEntry consumed by the host on a different origin.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Origin, Accept" always;

    # Module Federation manifest must not be cached aggressively.
    location ~* /(mf-manifest\.json|remoteEntry\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback for the shell. Static MF chunks are served from the file system.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
