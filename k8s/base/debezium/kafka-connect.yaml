apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: url-shortener
  labels: { app: kafka-connect }
spec:
  selector: { app: kafka-connect }
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: url-shortener
  labels: { app: kafka-connect }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-connect }
  template:
    metadata:
      labels: { app: kafka-connect }
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:2.7.3.Final
          ports:
            - containerPort: 8083
              name: rest
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-0.kafka.url-shortener.svc.cluster.local:9092"
            - name: GROUP_ID
              value: url-shortener
            - name: CONFIG_STORAGE_TOPIC
              value: connect_configs
            - name: OFFSET_STORAGE_TOPIC
              value: connect_offsets
            - name: STATUS_STORAGE_TOPIC
              value: connect_statuses
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            # The connector config says ${env:PGPASSWORD}; this provider fills it in
            # when the task starts, so the password is not in the JSON, the REST API
            # or the connect_configs topic. A new password needs a Connect restart.
            # One worker: reassign connectors at once after a rebalance. The 5 min
            # default waits for a lost worker to return, and after a broker restart
            # that meant 5 min with no events published.
            - name: CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS
              value: "0"
            - name: CONNECT_CONFIG_PROVIDERS
              value: env
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
# Registers the connector once the shortener has created the outbox publication.
# PUT is create-or-update. To apply a changed connector config, delete this Job
# and apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-shortener-outbox
  namespace: url-shortener
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-publication
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          command:
            - sh
            - -c
            - >-
              until psql -h postgres -U postgres -d shortener -Atc
              "SELECT 1 FROM pg_publication WHERE pubname = 'shortener_outbox'" | grep -q 1;
              do sleep 2; done
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - >-
              until curl -fsS -X PUT -H 'Content-Type: application/json'
              --data @/config/shortener-outbox.json
              http://kafka-connect:8083/connectors/shortener-outbox/config;
              do sleep 3; done
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: debezium-connector
