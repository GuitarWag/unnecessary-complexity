apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-shortener

resources:
  - namespace.yaml
  - secrets/secrets.yaml
  - kafka/kafka.yaml
  - postgres/postgres.yaml
  - debezium/kafka-connect.yaml
  - shortener/shortener.yaml
  - resolver/resolver.yaml
  - analytics/analytics.yaml
  - gateway/gateway.yaml
  - shell/shell.yaml
  - mf-url-input/mf-url-input.yaml
  - mf-create-button/mf-create-button.yaml
  - mf-copy-button/mf-copy-button.yaml
  - mf-url-list/mf-url-list.yaml
  - mf-analytics-chart/mf-analytics-chart.yaml
  - ingress/ingress.yaml

configMapGenerator:
  - name: postgres-init
    files: [postgres/init.sql]
  # No hash suffix: the registration Job's pod template is immutable, so a
  # renamed ConfigMap would make `kubectl apply` fail.
  - name: debezium-connector
    files: [debezium/shortener-outbox.json]
    options:
      disableNameSuffixHash: true
