apiVersion: v1
kind: Service
metadata:
  name: mf-create-button
  namespace: url-shortener
  labels: { app: mf-create-button }
spec:
  selector: { app: mf-create-button }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mf-create-button
  namespace: url-shortener
  labels: { app: mf-create-button }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mf-create-button }
  template:
    metadata:
      labels: { app: mf-create-button }
    spec:
      containers:
        - name: nginx
          image: url-shortener/mf-create-button:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 80, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
