# ESO logs in to Vault as this service account, through Vault's Kubernetes
# auth role "url-shortener" (scripts/vault-bootstrap.sh). The role can only read
# secret/url-shortener/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: url-shortener
          serviceAccountRef:
            name: vault-reader
---
# ESO copies secret/url-shortener/postgres from Vault into the k8s Secret
# postgres-credentials, and checks Vault again every minute. Workloads read
# only the k8s Secret and never talk to Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: postgres-credentials
  data:
    - secretKey: username
      remoteRef:
        key: url-shortener/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: url-shortener/postgres
        property: password
