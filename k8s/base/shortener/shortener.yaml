apiVersion: v1
kind: Service
metadata:
  name: shortener
  namespace: url-shortener
  labels: { app: shortener }
spec:
  selector: { app: shortener }
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener
  namespace: url-shortener
  labels: { app: shortener }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shortener }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: shortener }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: server
          image: url-shortener/shortener:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: METRICS_ADDR
              value: ":9090"
            - name: SHORTENER_ADDR
              value: ":50051"
            - name: SHORTENER_DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/shortener?sslmode=disable"
          readinessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 15
            periodSeconds: 20
