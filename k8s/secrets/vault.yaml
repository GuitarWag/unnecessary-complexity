apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
---
# Vault's Kubernetes auth method checks the service-account tokens that ESO
# presents through the TokenReview API, as this service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels: { app: vault }
spec:
  selector: { app: vault }
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
# Dev mode: unsealed, in-memory, root token "root". For a local kind cluster
# only. A restart loses all data; `make secrets-up` puts it back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels: { app: vault }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault }
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.18.3
          args: [server, -dev]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: root
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - containerPort: 8200
              name: http
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 5
